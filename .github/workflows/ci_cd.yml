name: Monorepo CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: TESTES DO AUTH-SERVICE
  # ------------------------------------------------------------------
  test-auth-service:
    runs-on: ubuntu-latest
    # Só roda se arquivos nesta pasta ou o workflow mudarem
    steps:
      - uses: actions/checkout@v4
      
      # Verifica se houve mudanças na pasta específica (Otimização)
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/auth-service/**'

      - name: Set up Python
        if: steps.filter.outputs.src == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.12'

      - name: Install Poetry
        if: steps.filter.outputs.src == 'true'
        run: pip install poetry
        
      - name: Install Deps
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/auth-service
        run: poetry install

      - name: Run Tests
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/auth-service
        run: poetry run pytest tests/unit --junitxml=test-results.xml --cov=src/auth_service --cov-report=term --cov-report=xml -v

      - name: Publish Test Results
        if: steps.filter.outputs.src == 'true' && always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'services/auth-service/test-results.xml'
          check_name: 'Auth Service Test Results'
          comment_title: '🧪 Auth Service Test Results'

      - name: Test Summary
        if: steps.filter.outputs.src == 'true' && always()
        working-directory: ./services/auth-service
        run: |
          echo "## 🧪 Auth Service Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          poetry run pytest tests/unit --co -q | tail -1 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results.xml ]; then
            echo "✅ Tests executed successfully" >> $GITHUB_STEP_SUMMARY
          fi

  # ------------------------------------------------------------------
  # JOB 2: TESTES DO COMPETITIONS-SERVICE
  # ------------------------------------------------------------------
  test-competitions-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/competitions-service/**'

      - name: Set up Python
        if: steps.filter.outputs.src == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.12'

      - name: Install Poetry
        if: steps.filter.outputs.src == 'true'
        run: pip install poetry

      - name: Install Deps
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/competitions-service
        run: poetry install

      - name: Run Tests
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/competitions-service
        run: poetry run pytest --junitxml=test-results.xml --cov=src --cov-report=term --cov-report=xml -v

      - name: Publish Test Results
        if: steps.filter.outputs.src == 'true' && always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'services/competitions-service/test-results.xml'
          check_name: 'Competitions Service Test Results'
          comment_title: '🏆 Competitions Service Test Results'

      - name: Test Summary
        if: steps.filter.outputs.src == 'true' && always()
        working-directory: ./services/competitions-service
        run: |
          echo "## 🏆 Competitions Service Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          poetry run pytest --co -q | tail -1 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results.xml ]; then
            echo "✅ Tests executed successfully" >> $GITHUB_STEP_SUMMARY
          fi

  # ------------------------------------------------------------------
  # JOB 3: TESTES DO LIVESTREAM-SERVICE
  # ------------------------------------------------------------------
  test-livestream-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/livestream-service/**'

      - name: Set up Node.js
        if: steps.filter.outputs.src == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install pnpm
        if: steps.filter.outputs.src == 'true'
        run: npm install -g pnpm

      - name: Install Dependencies
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/livestream-service
        run: pnpm install

      - name: Run Tests
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/livestream-service
        run: pnpm test:cov

      - name: Upload Coverage Report
        if: steps.filter.outputs.src == 'true'
        uses: codecov/codecov-action@v3
        with:
          files: ./services/livestream-service/coverage/lcov.info
          flags: livestream
          name: livestream-coverage

  # ------------------------------------------------------------------
  # JOB 4: TESTES DO SOCIAL-SERVICE
  # ------------------------------------------------------------------

  #IMPLEMENTAÇÃO PENDENTE

  # ------------------------------------------------------------------
  # JOB 5: GATEKEEPER (DEPLOY)
  # Este job só roda se os anteriores forem bem sucedidos
  # ------------------------------------------------------------------
  gatekeeper:
    needs: [test-auth-service, test-competitions-service, test-livestream-service]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Check All Tests Passed
        run: |
          echo "✅ All tests passed successfully!"
          echo "Auth Service: PASSED"
          echo "Competitions Service: PASSED"
          echo "Livestream Service: PASSED"

  #IMPLEMENTAÇÃO PENDENTE (A DEFINIR ESTRATÉGIA DE DEPLOY)