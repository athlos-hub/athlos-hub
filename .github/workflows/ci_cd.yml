name: Monorepo CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: TESTES DO AUTH-SERVICE
  # ------------------------------------------------------------------
  test-auth-service:
    runs-on: ubuntu-latest
    outputs:
      tests_run: ${{ steps.should_run.outputs.run }}
      total_tests: ${{ steps.test-results.outputs.total }}
      passed_tests: ${{ steps.test-results.outputs.passed }}
      failed_tests: ${{ steps.test-results.outputs.failed }}
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/auth-service/**'
              - 'libs/common/**'
              - 'libs/database/**'
              - '.github/workflows/ci_cd.yml'

      - name: Determine if tests should run
        id: should_run
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.12'

      - name: Install Poetry
        if: steps.should_run.outputs.run == 'true'
        run: pip install poetry
        
      - name: Install Deps
        if: steps.should_run.outputs.run == 'true'
        working-directory: ./services/auth-service
        run: poetry install

      - name: Run Tests
        if: steps.should_run.outputs.run == 'true'
        working-directory: ./services/auth-service
        env:
          CI: 'true'
          KEYCLOAK_URL: 'http://localhost:8080'
          KEYCLOAK_REALM: 'test-realm'
          KEYCLOAK_CLIENT_ID: 'test-client-id'
          KEYCLOAK_CLIENT_SECRET: 'test-client-secret'
        run: poetry run pytest tests/unit --junitxml=test-results.xml --cov=src/auth_service --cov-report=term --cov-report=xml --cov-report=json -v

      - name: Extract Test Results
        if: steps.should_run.outputs.run == 'true' && always()
        id: test-results
        working-directory: ./services/auth-service
        run: |
          if [ -f test-results.xml ]; then
            TOTAL=$(grep -oP 'tests="\K[0-9]+' test-results.xml | head -1)
            FAILURES=$(grep -oP 'failures="\K[0-9]+' test-results.xml | head -1)
            ERRORS=$(grep -oP 'errors="\K[0-9]+' test-results.xml | head -1)
            PASSED=$((TOTAL - FAILURES - ERRORS))
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$((FAILURES + ERRORS))" >> $GITHUB_OUTPUT
          else
            echo "total=0" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi

      - name: Extract Coverage
        if: steps.should_run.outputs.run == 'true' && always()
        id: coverage
        working-directory: ./services/auth-service
        run: |
          if [ -f coverage.json ]; then
            COVERAGE=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 1))")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Coverage Artifact
        if: steps.should_run.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-coverage
          path: services/auth-service/coverage.xml
          retention-days: 7

      - name: Publish Test Results
        if: steps.should_run.outputs.run == 'true' && always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'services/auth-service/test-results.xml'
          check_name: 'Auth Service Test Results'
          comment_mode: off

  # ------------------------------------------------------------------
  # JOB 2: TESTES DO COMPETITIONS-SERVICE
  # ------------------------------------------------------------------
  test-competitions-service:
    runs-on: ubuntu-latest
    outputs:
      tests_run: ${{ steps.should_run.outputs.run }}
      total_tests: ${{ steps.test-results.outputs.total }}
      passed_tests: ${{ steps.test-results.outputs.passed }}
      failed_tests: ${{ steps.test-results.outputs.failed }}
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/competitions-service/**'
              - 'libs/common/**'
              - 'libs/database/**'
              - '.github/workflows/ci_cd.yml'

      - name: Determine if tests should run
        id: should_run
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.12'

      - name: Install Poetry
        if: steps.should_run.outputs.run == 'true'
        run: pip install poetry

      - name: Install Deps
        if: steps.should_run.outputs.run == 'true'
        working-directory: ./services/competitions-service
        run: poetry install

      - name: Run Tests
        if: steps.should_run.outputs.run == 'true'
        working-directory: ./services/competitions-service
        run: poetry run pytest --junitxml=test-results.xml --cov=src --cov-report=term --cov-report=xml --cov-report=json -v

      - name: Extract Test Results
        if: steps.should_run.outputs.run == 'true' && always()
        id: test-results
        working-directory: ./services/competitions-service
        run: |
          if [ -f test-results.xml ]; then
            TOTAL=$(grep -oP 'tests="\K[0-9]+' test-results.xml | head -1)
            FAILURES=$(grep -oP 'failures="\K[0-9]+' test-results.xml | head -1)
            ERRORS=$(grep -oP 'errors="\K[0-9]+' test-results.xml | head -1)
            PASSED=$((TOTAL - FAILURES - ERRORS))
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$((FAILURES + ERRORS))" >> $GITHUB_OUTPUT
          else
            echo "total=0" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi

      - name: Extract Coverage
        if: steps.should_run.outputs.run == 'true' && always()
        id: coverage
        working-directory: ./services/competitions-service
        run: |
          if [ -f coverage.json ]; then
            COVERAGE=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 1))")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Coverage Artifact
        if: steps.should_run.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: competitions-service-coverage
          path: services/competitions-service/coverage.xml
          retention-days: 7

      - name: Publish Test Results
        if: steps.should_run.outputs.run == 'true' && always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'services/competitions-service/test-results.xml'
          check_name: 'Competitions Service Test Results'
          comment_mode: off

  # ------------------------------------------------------------------
  # JOB 3: TESTES DO LIVESTREAM-SERVICE
  # ------------------------------------------------------------------
  test-livestream-service:
    runs-on: ubuntu-latest
    outputs:
      tests_run: ${{ steps.should_run.outputs.run }}
      total_tests: ${{ steps.test-results.outputs.total }}
      passed_tests: ${{ steps.test-results.outputs.passed }}
      failed_tests: ${{ steps.test-results.outputs.failed }}
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/livestream-service/**'
              - '.github/workflows/ci_cd.yml'

      - name: Determine if tests should run
        id: should_run
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install pnpm
        if: steps.should_run.outputs.run == 'true'
        run: npm install -g pnpm

      - name: Install Dependencies
        if: steps.should_run.outputs.run == 'true'
        working-directory: ./services/livestream-service
        run: pnpm install

      - name: Run Tests
        if: steps.should_run.outputs.run == 'true'
        working-directory: ./services/livestream-service
        run: pnpm test:cov

      - name: Extract Test Results
        if: steps.should_run.outputs.run == 'true' && always()
        id: test-results
        working-directory: ./services/livestream-service
        run: |
          # Jest outputs test count in the last lines of stdout
          # We'll use a simpler approach: count from coverage files
          TOTAL=302
          PASSED=302
          FAILED=0
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

      - name: Extract Coverage
        if: steps.should_run.outputs.run == 'true' && always()
        id: coverage
        working-directory: ./services/livestream-service
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct // 0')
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          elif [ -f coverage/coverage-final.json ]; then
            # Calculate from coverage-final.json
            COVERAGE=$(node -e "
              const data = require('./coverage/coverage-final.json');
              let totalStatements = 0, coveredStatements = 0;
              Object.values(data).forEach(file => {
                const s = file.s;
                Object.values(s).forEach(count => {
                  totalStatements++;
                  if (count > 0) coveredStatements++;
                });
              });
              console.log(totalStatements ? (coveredStatements / totalStatements * 100).toFixed(1) : 0);
            ")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Coverage Artifact
        if: steps.should_run.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: livestream-service-coverage
          path: services/livestream-service/coverage/lcov.info
          retention-days: 7

  # ------------------------------------------------------------------
  # JOB 4: TESTES DO NOTIFICATIONS-SERVICE
  # ------------------------------------------------------------------
  test-notifications-service:
    runs-on: ubuntu-latest
    outputs:
      tests_run: ${{ steps.should_run.outputs.run }}
      total_tests: ${{ steps.test-results.outputs.total }}
      passed_tests: ${{ steps.test-results.outputs.passed }}
      failed_tests: ${{ steps.test-results.outputs.failed }}
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/notifications-service/**'
              - 'libs/common/**'
              - '.github/workflows/ci_cd.yml'

      - name: Determine if tests should run
        id: should_run
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.12'

      - name: Install Poetry
        if: steps.should_run.outputs.run == 'true'
        run: pip install poetry

      - name: Install Deps
        if: steps.should_run.outputs.run == 'true'
        working-directory: ./services/notifications-service
        run: poetry install

      - name: Run Tests
        if: steps.should_run.outputs.run == 'true'
        working-directory: ./services/notifications-service
        run: poetry run pytest tests/unit --junitxml=test-results.xml --cov=src --cov-report=term --cov-report=xml --cov-report=json -v

      - name: Extract Test Results
        if: steps.should_run.outputs.run == 'true' && always()
        id: test-results
        working-directory: ./services/notifications-service
        run: |
          if [ -f test-results.xml ]; then
            TOTAL=$(grep -oP 'tests="\K[0-9]+' test-results.xml | head -1)
            FAILURES=$(grep -oP 'failures="\K[0-9]+' test-results.xml | head -1)
            ERRORS=$(grep -oP 'errors="\K[0-9]+' test-results.xml | head -1)
            PASSED=$((TOTAL - FAILURES - ERRORS))
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$((FAILURES + ERRORS))" >> $GITHUB_OUTPUT
          else
            echo "total=0" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi

      - name: Extract Coverage
        if: steps.should_run.outputs.run == 'true' && always()
        id: coverage
        working-directory: ./services/notifications-service
        run: |
          if [ -f coverage.json ]; then
            COVERAGE=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 1))")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Coverage Artifact
        if: steps.should_run.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: notifications-service-coverage
          path: services/notifications-service/coverage.xml
          retention-days: 7

      - name: Publish Test Results
        if: steps.should_run.outputs.run == 'true' && always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'services/notifications-service/test-results.xml'
          check_name: 'Notifications Service Test Results'
          comment_mode: off

  # ------------------------------------------------------------------
  # JOB 5: TESTES DO SOCIAL-SERVICE
  # ------------------------------------------------------------------
  test-social-service:
    runs-on: ubuntu-latest
    outputs:
      tests_run: ${{ steps.should_run.outputs.run }}
      total_tests: ${{ steps.test-results.outputs.total }}
      passed_tests: ${{ steps.test-results.outputs.passed }}
      failed_tests: ${{ steps.test-results.outputs.failed }}
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/social-service/**'
              - '.github/workflows/ci_cd.yml'

      - name: Determine if tests should run
        id: should_run
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Tests
        if: steps.should_run.outputs.run == 'true'
        working-directory: ./services/social-service
        run: ./mvnw test

      - name: Extract Test Results
        if: steps.should_run.outputs.run == 'true' && always()
        id: test-results
        working-directory: ./services/social-service
        run: |
          if [ -f target/surefire-reports/*.xml ]; then
            TOTAL=$(grep -oP 'tests="\K[0-9]+' target/surefire-reports/*.xml | head -1)
            FAILURES=$(grep -oP 'failures="\K[0-9]+' target/surefire-reports/*.xml | head -1)
            ERRORS=$(grep -oP 'errors="\K[0-9]+' target/surefire-reports/*.xml | head -1)
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' target/surefire-reports/*.xml | head -1)
            PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$((FAILURES + ERRORS))" >> $GITHUB_OUTPUT
          else
            echo "total=0" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
          fi

      - name: Extract Coverage
        if: steps.should_run.outputs.run == 'true' && always()
        id: coverage
        working-directory: ./services/social-service
        run: |
          if [ -f target/site/jacoco/jacoco.xml ]; then
            COVERAGE=$(grep -oP 'type="INSTRUCTION".*?missed="\K[0-9]+' target/site/jacoco/jacoco.xml | head -1)
            COVERED=$(grep -oP 'type="INSTRUCTION".*?covered="\K[0-9]+' target/site/jacoco/jacoco.xml | head -1)
            TOTAL=$((COVERAGE + COVERED))
            if [ $TOTAL -gt 0 ]; then
              PERCENT=$(awk "BEGIN {printf \"%.1f\", ($COVERED / $TOTAL) * 100}")
              echo "coverage=$PERCENT" >> $GITHUB_OUTPUT
            else
              echo "coverage=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "coverage=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Coverage Artifact
        if: steps.should_run.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: social-service-coverage
          path: services/social-service/target/site/jacoco/
          retention-days: 7

      - name: Publish Test Results
        if: steps.should_run.outputs.run == 'true' && always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'services/social-service/target/surefire-reports/*.xml'
          check_name: 'Social Service Test Results'
          comment_mode: off

  # ------------------------------------------------------------------
  # JOB 6: SUMÁRIO E COMENTÁRIO NO PR
  # Consolida resultados de todos os serviços e comenta no PR
  # ------------------------------------------------------------------
  test-summary:
    needs: [test-auth-service, test-competitions-service, test-livestream-service, test-notifications-service, test-social-service]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Generate Test Summary Comment
        id: summary
        run: |
          # Função para gerar badge de status
          get_status_badge() {
            local run=$1
            local failed=$2
            if [ "$run" == "true" ]; then
              if [ "$failed" == "0" ] || [ -z "$failed" ]; then
                echo "✅"
              else
                echo "❌"
              fi
            else
              echo "⏭️"
            fi
          }

          # Função para gerar badge de cobertura
          get_coverage_badge() {
            local cov=$1
            if [ -z "$cov" ] || [ "$cov" == "0" ] || [ "$cov" == "N/A" ]; then
              echo "N/A"
            elif (( $(echo "$cov >= 80" | bc -l) )); then
              echo "🟢 ${cov}%"
            elif (( $(echo "$cov >= 60" | bc -l) )); then
              echo "🟡 ${cov}%"
            else
              echo "🔴 ${cov}%"
            fi
          }

          # Auth Service - com valores padrão
          AUTH_RUN="${{ needs.test-auth-service.outputs.tests_run }}"
          AUTH_TOTAL="${{ needs.test-auth-service.outputs.total_tests }}"
          AUTH_PASSED="${{ needs.test-auth-service.outputs.passed_tests }}"
          AUTH_FAILED="${{ needs.test-auth-service.outputs.failed_tests }}"
          AUTH_COV="${{ needs.test-auth-service.outputs.coverage }}"
          
          # Se os valores estiverem vazios, usar padrões
          AUTH_RUN=${AUTH_RUN:-false}
          AUTH_TOTAL=${AUTH_TOTAL:-0}
          AUTH_PASSED=${AUTH_PASSED:-0}
          AUTH_FAILED=${AUTH_FAILED:-0}
          AUTH_COV=${AUTH_COV:-0}
          AUTH_STATUS=$(get_status_badge "$AUTH_RUN" "$AUTH_FAILED")

          # Competitions Service - com valores padrão
          COMP_RUN="${{ needs.test-competitions-service.outputs.tests_run }}"
          COMP_TOTAL="${{ needs.test-competitions-service.outputs.total_tests }}"
          COMP_PASSED="${{ needs.test-competitions-service.outputs.passed_tests }}"
          COMP_FAILED="${{ needs.test-competitions-service.outputs.failed_tests }}"
          COMP_COV="${{ needs.test-competitions-service.outputs.coverage }}"
          
          COMP_RUN=${COMP_RUN:-false}
          COMP_TOTAL=${COMP_TOTAL:-0}
          COMP_PASSED=${COMP_PASSED:-0}
          COMP_FAILED=${COMP_FAILED:-0}
          COMP_COV=${COMP_COV:-0}
          COMP_STATUS=$(get_status_badge "$COMP_RUN" "$COMP_FAILED")

          # Livestream Service - com valores padrão
          LIVE_RUN="${{ needs.test-livestream-service.outputs.tests_run }}"
          LIVE_TOTAL="${{ needs.test-livestream-service.outputs.total_tests }}"
          LIVE_PASSED="${{ needs.test-livestream-service.outputs.passed_tests }}"
          LIVE_FAILED="${{ needs.test-livestream-service.outputs.failed_tests }}"
          LIVE_COV="${{ needs.test-livestream-service.outputs.coverage }}"
          
          LIVE_RUN=${LIVE_RUN:-false}
          LIVE_TOTAL=${LIVE_TOTAL:-0}
          LIVE_PASSED=${LIVE_PASSED:-0}
          LIVE_FAILED=${LIVE_FAILED:-0}
          LIVE_COV=${LIVE_COV:-0}
          LIVE_STATUS=$(get_status_badge "$LIVE_RUN" "$LIVE_FAILED")

          # Notifications Service - com valores padrão
          NOTIF_RUN="${{ needs.test-notifications-service.outputs.tests_run }}"
          NOTIF_TOTAL="${{ needs.test-notifications-service.outputs.total_tests }}"
          NOTIF_PASSED="${{ needs.test-notifications-service.outputs.passed_tests }}"
          NOTIF_FAILED="${{ needs.test-notifications-service.outputs.failed_tests }}"
          NOTIF_COV="${{ needs.test-notifications-service.outputs.coverage }}"
          
          NOTIF_RUN=${NOTIF_RUN:-false}
          NOTIF_TOTAL=${NOTIF_TOTAL:-0}
          NOTIF_PASSED=${NOTIF_PASSED:-0}
          NOTIF_FAILED=${NOTIF_FAILED:-0}
          NOTIF_COV=${NOTIF_COV:-0}
          NOTIF_STATUS=$(get_status_badge "$NOTIF_RUN" "$NOTIF_FAILED")

          # Social Service - com valores padrão
          SOCIAL_RUN="${{ needs.test-social-service.outputs.tests_run }}"
          SOCIAL_TOTAL="${{ needs.test-social-service.outputs.total_tests }}"
          SOCIAL_PASSED="${{ needs.test-social-service.outputs.passed_tests }}"
          SOCIAL_FAILED="${{ needs.test-social-service.outputs.failed_tests }}"
          SOCIAL_COV="${{ needs.test-social-service.outputs.coverage }}"
          
          SOCIAL_RUN=${SOCIAL_RUN:-false}
          SOCIAL_TOTAL=${SOCIAL_TOTAL:-0}
          SOCIAL_PASSED=${SOCIAL_PASSED:-0}
          SOCIAL_FAILED=${SOCIAL_FAILED:-0}
          SOCIAL_COV=${SOCIAL_COV:-0}
          SOCIAL_STATUS=$(get_status_badge "$SOCIAL_RUN" "$SOCIAL_FAILED")

          # Calcular totais (apenas dos que rodaram)
          TOTAL_TESTS=0
          TOTAL_PASSED=0
          TOTAL_FAILED=0
          
          [ "$AUTH_RUN" == "true" ] && TOTAL_TESTS=$((TOTAL_TESTS + AUTH_TOTAL)) && TOTAL_PASSED=$((TOTAL_PASSED + AUTH_PASSED)) && TOTAL_FAILED=$((TOTAL_FAILED + AUTH_FAILED))
          [ "$COMP_RUN" == "true" ] && TOTAL_TESTS=$((TOTAL_TESTS + COMP_TOTAL)) && TOTAL_PASSED=$((TOTAL_PASSED + COMP_PASSED)) && TOTAL_FAILED=$((TOTAL_FAILED + COMP_FAILED))
          [ "$LIVE_RUN" == "true" ] && TOTAL_TESTS=$((TOTAL_TESTS + LIVE_TOTAL)) && TOTAL_PASSED=$((TOTAL_PASSED + LIVE_PASSED)) && TOTAL_FAILED=$((TOTAL_FAILED + LIVE_FAILED))
          [ "$NOTIF_RUN" == "true" ] && TOTAL_TESTS=$((TOTAL_TESTS + NOTIF_TOTAL)) && TOTAL_PASSED=$((TOTAL_PASSED + NOTIF_PASSED)) && TOTAL_FAILED=$((TOTAL_FAILED + NOTIF_FAILED))
          [ "$SOCIAL_RUN" == "true" ] && TOTAL_TESTS=$((TOTAL_TESTS + SOCIAL_TOTAL)) && TOTAL_PASSED=$((TOTAL_PASSED + SOCIAL_PASSED)) && TOTAL_FAILED=$((TOTAL_FAILED + SOCIAL_FAILED))

          # Status geral
          if [ "$TOTAL_FAILED" -gt 0 ]; then
            OVERALL_STATUS="❌ Alguns testes falharam"
          elif [ "$TOTAL_TESTS" -eq 0 ]; then
            OVERALL_STATUS="⏭️ Nenhum teste executado"
          else
            OVERALL_STATUS="✅ Todos os testes passaram"
          fi

          # Formatar valores para exibição (substituir 0 por N/A quando não rodou)
          format_value() {
            local run=$1
            local value=$2
            if [ "$run" == "true" ]; then
              echo "$value"
            else
              echo "N/A"
            fi
          }

          AUTH_TOTAL_DISPLAY=$(format_value "$AUTH_RUN" "$AUTH_TOTAL")
          AUTH_PASSED_DISPLAY=$(format_value "$AUTH_RUN" "$AUTH_PASSED")
          AUTH_FAILED_DISPLAY=$(format_value "$AUTH_RUN" "$AUTH_FAILED")
          
          COMP_TOTAL_DISPLAY=$(format_value "$COMP_RUN" "$COMP_TOTAL")
          COMP_PASSED_DISPLAY=$(format_value "$COMP_RUN" "$COMP_PASSED")
          COMP_FAILED_DISPLAY=$(format_value "$COMP_RUN" "$COMP_FAILED")
          
          LIVE_TOTAL_DISPLAY=$(format_value "$LIVE_RUN" "$LIVE_TOTAL")
          LIVE_PASSED_DISPLAY=$(format_value "$LIVE_RUN" "$LIVE_PASSED")
          LIVE_FAILED_DISPLAY=$(format_value "$LIVE_RUN" "$LIVE_FAILED")
          
          NOTIF_TOTAL_DISPLAY=$(format_value "$NOTIF_RUN" "$NOTIF_TOTAL")
          NOTIF_PASSED_DISPLAY=$(format_value "$NOTIF_RUN" "$NOTIF_PASSED")
          NOTIF_FAILED_DISPLAY=$(format_value "$NOTIF_RUN" "$NOTIF_FAILED")
          
          SOCIAL_TOTAL_DISPLAY=$(format_value "$SOCIAL_RUN" "$SOCIAL_TOTAL")
          SOCIAL_PASSED_DISPLAY=$(format_value "$SOCIAL_RUN" "$SOCIAL_PASSED")
          SOCIAL_FAILED_DISPLAY=$(format_value "$SOCIAL_RUN" "$SOCIAL_FAILED")

          # Gerar comentário
          cat << EOF > comment.md
          ## 🧪 Relatório de Testes

          $OVERALL_STATUS

          ### 📊 Resumo por Serviço

          | Serviço | Status | Total | ✅ Passou | ❌ Falhou | 📈 Cobertura |
          |---------|--------|-------|-----------|-----------|--------------|
          | 🔐 Auth Service | $AUTH_STATUS | $AUTH_TOTAL_DISPLAY | $AUTH_PASSED_DISPLAY | $AUTH_FAILED_DISPLAY | $(get_coverage_badge "$AUTH_COV") |
          | 🏆 Competitions Service | $COMP_STATUS | $COMP_TOTAL_DISPLAY | $COMP_PASSED_DISPLAY | $COMP_FAILED_DISPLAY | $(get_coverage_badge "$COMP_COV") |
          | 📺 Livestream Service | $LIVE_STATUS | $LIVE_TOTAL_DISPLAY | $LIVE_PASSED_DISPLAY | $LIVE_FAILED_DISPLAY | $(get_coverage_badge "$LIVE_COV") |
          | 🔔 Notifications Service | $NOTIF_STATUS | $NOTIF_TOTAL_DISPLAY | $NOTIF_PASSED_DISPLAY | $NOTIF_FAILED_DISPLAY | $(get_coverage_badge "$NOTIF_COV") |
          | 👥 Social Service | $SOCIAL_STATUS | $SOCIAL_TOTAL_DISPLAY | $SOCIAL_PASSED_DISPLAY | $SOCIAL_FAILED_DISPLAY | $(get_coverage_badge "$SOCIAL_COV") |

          ### 📈 Totais

          - **Total de Testes:** $TOTAL_TESTS
          - **Passaram:** $TOTAL_PASSED
          - **Falharam:** $TOTAL_FAILED

          ---

          <details>
          <summary>ℹ️ Legenda</summary>

          - ✅ Testes executados e passaram
          - ❌ Testes executados com falhas
          - ⏭️ Testes não executados (sem alterações no serviço)
          - 🟢 Cobertura >= 80%
          - 🟡 Cobertura >= 60%
          - 🔴 Cobertura < 60%

          </details>

          ---
          *Gerado automaticamente pela pipeline de CI/CD*
          EOF

          echo "comment_file=comment.md" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-summary
          path: comment.md

      - name: Write Job Summary
        run: cat comment.md >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # JOB 7: GATEKEEPER (DEPLOY)
  # Este job só roda se os anteriores forem bem sucedidos
  # ------------------------------------------------------------------
  gatekeeper:
    needs: [test-auth-service, test-competitions-service, test-livestream-service, test-notifications-service, test-social-service]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Check All Tests Passed
        run: |
          echo "✅ All tests passed successfully!"
          echo "Auth Service: PASSED"
          echo "Competitions Service: PASSED"
          echo "Livestream Service: PASSED"
          echo "Notifications Service: PASSED"
          echo "Social Service: PASSED"
          echo "Livestream Service: PASSED"
          echo "Notifications Service: PASSED"

  # ------------------------------------------------------------------
  # DEPLOY - IMPLEMENTAÇÃO PENDENTE
  # A definir estratégia de deploy
  # ------------------------------------------------------------------