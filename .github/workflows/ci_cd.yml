name: Monorepo CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: TESTES DO AUTH-SERVICE
  # ------------------------------------------------------------------
  test-auth-service:
    runs-on: ubuntu-latest
    # Só roda se arquivos nesta pasta ou o workflow mudarem
    steps:
      - uses: actions/checkout@v4
      
      # Verifica se houve mudanças na pasta específica (Otimização)
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/auth_service/**'

      - name: Set up Python
        if: steps.filter.outputs.src == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.12'

      - name: Install Poetry
        if: steps.filter.outputs.src == 'true'
        run: pip install poetry
        
      - name: Install Deps
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/auth_service
        run: poetry install

      - name: Run Tests
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/auth_service
        run: poetry run pytest

  # ------------------------------------------------------------------
  # JOB 2: TESTES DO COMPETITIONS-SERVICE
  # ------------------------------------------------------------------
  test-competitions-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/competitions_service/**'

      - name: Set up Python
        if: steps.filter.outputs.src == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.12'

      - name: Install Poetry
        if: steps.filter.outputs.src == 'true'
        run: pip install poetry

      - name: Install Deps
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/competitions_service
        run: poetry install

      - name: Run Tests
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/competitions_service
        run: poetry run pytest

  # ------------------------------------------------------------------
  # JOB 3: TESTES DO NOTIFICATIONS-SERVICE
  # ------------------------------------------------------------------
  test-notifications-service:
    runs-on: ubuntu-latest
    
    # Services para testes E2E
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notifications_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/notifications-service/**'

      - name: Set up Python
        if: steps.filter.outputs.src == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.12'

      - name: Install Poetry
        if: steps.filter.outputs.src == 'true'
        run: pip install poetry

      - name: Install Dependencies
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/notifications-service
        run: poetry install

      - name: Run Unit & Integration Tests
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/notifications-service
        run: poetry run pytest tests/unit tests/integration -v

      - name: Run E2E Tests
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/notifications-service
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/notifications_test
          NOVU_API_KEY: test-api-key
          NOVU_APP_ID: test-app-id
        run: poetry run pytest tests/e2e -v

  # ------------------------------------------------------------------
  # JOB 4: TESTES DO LIVESTREAM-SERVICE
  # ------------------------------------------------------------------
  test-livestream-service:
    runs-on: ubuntu-latest
    
    # Services para testes E2E
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livestream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            src:
              - 'services/livestream-service/**'

      - name: Set up Node.js
        if: steps.filter.outputs.src == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install pnpm
        if: steps.filter.outputs.src == 'true'
        run: npm install -g pnpm

      - name: Install Dependencies
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/livestream-service
        run: pnpm install

      - name: Generate Prisma Client
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/livestream-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/livestream_test?schema=livestream_schema
        run: npx prisma generate

      - name: Run Prisma Migrations
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/livestream-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/livestream_test?schema=livestream_schema
        run: npx prisma migrate deploy

      - name: Run Unit Tests
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/livestream-service
        run: pnpm test:cov

      - name: Run E2E Tests
        if: steps.filter.outputs.src == 'true'
        working-directory: ./services/livestream-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/livestream_test?schema=livestream_schema
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
        run: pnpm test:e2e

      - name: Upload Coverage Report
        if: steps.filter.outputs.src == 'true'
        uses: codecov/codecov-action@v3
        with:
          files: ./services/livestream-service/coverage/lcov.info
          flags: livestream
          name: livestream-coverage

  # ------------------------------------------------------------------
  # JOB 5: TESTES DO SOCIAL-SERVICE
  # ------------------------------------------------------------------

  #IMPLEMENTAÇÃO PENDENTE

  # ------------------------------------------------------------------
  # JOB 6: GATEKEEPER (DEPLOY)
  # Este job só roda se os anteriores forem bem sucedidos
  # ------------------------------------------------------------------

  #IMPLEMENTAÇÃO PENDENTE (A DEFINIR ESTRATÉGIA DE DEPLOY)