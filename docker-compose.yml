services:
  # Gateway Kong: sem KONG_NGINX_* / proxy_* globais no compose. Timeouts longos do SSE vêm
  # só do serviço declarative `notifications-sse-service` (read_timeout/write_timeout). Comentários
  # SSE `: keepalive` resetam o read_timeout entre upstream e Kong; keepalive HTTP entre cliente e Kong
  # é ortogonal (conexão persistente na porta 8000).
  api-gateway:
    image: kong:3.9
    environment:
      KONG_DATABASE: 'off'
      KONG_ADMIN_LISTEN: '0.0.0.0:8101'
      KONG_ADMIN_GUI_URL: http://localhost:8102
      KONG_DECLARATIVE_CONFIG: '/kong/config.yml'
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: 'cjson,cjson.safe'
    volumes:
      - './docker/kong/config.yml:/kong/config.yml'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8100:8000"
      - "8101:8001"
      - "8102:8002"
      - "8103:8443"
      - "8104:8444"

  # Realm athlos: import em keycloak/athlos-realm.json (start-dev --import-realm).
  # Usuário da aplicação admin@athlos.com / AthlosAdminDev1! (realm roles: admin + default).
  # Troque a senha no JSON em produção ou recrie o volume do Keycloak após alterar.
  keycloak:
    image: keycloak/keycloak:26.5
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_HOSTNAME: http://localhost:8100/keycloak
      KC_HOSTNAME_ADMIN: http://localhost:8100/keycloak
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_pg:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      keycloak_pg:
        condition: service_healthy
    command: start-dev --import-realm

  keycloak_pg:
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_USERNAME: keycloak
      POSTGRESQL_PASSWORD: keycloak
      POSTGRESQL_DATABASE: keycloak_db
    volumes:
      - keycloak_pg_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3-rc-management-alpine
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: athlos
      RABBITMQ_DEFAULT_PASS: athlos
      # Cookie fixo evita estado inconsistente; alinhar com qualquer nó extra em cluster.
      # Aviso "Overriding Erlang cookie" no boot é esperado quando esta var está definida.
      RABBITMQ_ERLANG_COOKIE: athlos_erlang_cookie_dev
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    # tmpfs evita eacces em .erlang.cookie com volume nomeado antigo/permissões no host.
    # Para persistir filas entre `docker compose down`, troque por volume nomeado e:
    #   docker compose down -v   # uma vez, para recriar o volume limpo
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  keycloak_pg_data:
