services:
  api-gateway:
    image: kong:3.9
    environment:
      KONG_DATABASE: 'off'
      KONG_ADMIN_LISTEN: '0.0.0.0:8101'
      KONG_ADMIN_GUI_URL: http://localhost:8102
      KONG_DECLARATIVE_CONFIG: '/kong/config.yml'
    volumes:
      - './docker/kong/config.yml:/kong/config.yml'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8100:8000"
      - "8101:8001"
      - "8102:8002"
      - "8103:8443"
      - "8104:8444"

  keycloak:
    image: keycloak/keycloak:26.5
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_HOSTNAME: http://localhost:8100/keycloak
      KC_HOSTNAME_ADMIN: http://localhost:8100/keycloak
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_pg:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      keycloak_pg:
        condition: service_healthy
    command: start-dev --import-realm

  keycloak_pg:
    image: bitnami/postgresql:latest
    environment:
      POSTGRESQL_USERNAME: keycloak
      POSTGRESQL_PASSWORD: keycloak
      POSTGRESQL_DATABASE: keycloak_db
    volumes:
      - keycloak_pg_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  keycloak_pg_data:
