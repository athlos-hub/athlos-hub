services:
  social-pg:
    image: bitnami/postgresql:latest
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - ./docker:/docker-entrypoint-initdb.d:ro
      - social_pg_data:/bitnami/postgresql

volumes:
  social_pg_data: