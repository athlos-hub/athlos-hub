spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/social_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  data:
    redis:
      host: localhost
      port: 6380

# Logging para testes
logging:
  level:
    root: WARN
    br.com.athloshub: INFO
    org.springframework.test: INFO

# Configurações específicas de testes
server:
  port: 0  # Porta aleatória para testes

# Desabilitar serviços externos em testes
services:
  auth:
    url: http://localhost:8000
  competitions:
    url: http://localhost:8001
  notifications:
    url: http://localhost:8003
