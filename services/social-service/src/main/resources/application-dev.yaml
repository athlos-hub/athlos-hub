spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  
  flyway:
    enabled: true
    clean-disabled: false

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  
logging:
  level:
    root: INFO
    br.com.athloshub.social_service: DEBUG
    feign: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
