[project]
name = "live-service"
version = "0.1.0"
description = "Live streaming and calendar API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12,<4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.115.0,<0.122.0"
uvicorn = {version = ">=0.32.0,<0.40.0", extras = ["standard"]}
sqlalchemy = {version = ">=2.0.36,<3.0.0", extras = ["asyncio"]}
asyncpg = ">=0.30.0,<0.31.0"
alembic = ">=1.14.0,<2.0.0"
redis = ">=5.2.0,<6.0.0"
httpx = ">=0.27.0,<0.29.0"
google-auth = ">=2.36.0,<3.0.0"
google-auth-oauthlib = ">=1.2.0,<2.0.0"
google-api-python-client = ">=2.154.0,<3.0.0"
python-socketio = ">=5.11.0,<6.0.0"
apscheduler = ">=3.10.0,<4.0.0"
pydantic-settings = ">=2.6.0,<3.0.0"
python-multipart = ">=0.0.9"
psycopg2-binary = ">=2.9.0,<3.0.0"
python-dotenv = ">=1.0.0,<2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24.0"
pytest-cov = ">=4.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/live_service"]
