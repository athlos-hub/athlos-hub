services:
  live-pg:
    image: bitnami/postgresql:latest
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - ./docker:/docker-entrypoint-initdb.d:ro
      - live_pg_data:/bitnami/postgresql
    networks:
      - athlos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  live-mediamtx:
    image: bluenviron/mediamtx:1-ffmpeg
    ports:
      - "1935:1935" # RTMP
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC
      - "9997:9997" # API
      - "9998:9998" # Prometheus metrics
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./scripts/mediamtx-on-publish-ended.sh:/mediamtx-hooks/on-publish-ended.sh:ro
    environment:
      # App no host (uvicorn :8004): use host.docker.internal.
      # Com live-service no mesmo compose/rede: defina MEDIAMTX_WEBHOOK_BASE=http://live-service:8004
      MEDIAMTX_WEBHOOK_BASE: ${MEDIAMTX_WEBHOOK_BASE:-http://host.docker.internal:8004}
      MTX_AUTHHTTPADDRESS: ${MTX_AUTHHTTPADDRESS:-http://host.docker.internal:8004/api/webhooks/mediamtx-auth}
    networks:
      - athlos-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  live-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - live_redis_data:/data
    networks:
      - athlos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  live_pg_data:
  live_redis_data: {}

networks:
  athlos-network:
    driver: bridge
